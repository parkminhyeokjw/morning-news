name: morning-news
on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python build.py
      - name: Commit page
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs; git commit -m "news $(date -u +%F)" || true; git push
