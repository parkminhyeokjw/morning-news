name: morning-news
on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python build.py
      - name: Commit page
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs; git commit -m "news $(date -u +%F)" || true; git push
      - name: Push notification
        run: |
          curl -s -H "Title: ☀️ 아침 경제뉴스" -H "Click: https://parkminhyeokjw.github.io/morning-news/"             -H "Priority: high" -d "$(cat push.txt)" https://ntfy.sh/morning-news-a2eb8d7d47
